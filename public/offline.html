<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Euro Brands — دون اتصال</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1c1e26;
        color: #e8e9ef;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 14px;
        padding: 24px;
        box-sizing: border-box;
      }
      .dot {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(108, 99, 255, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #a3a6b3;
        max-width: 22rem;
        line-height: 1.7;
      }
      button {
        margin-top: 8px;
        background: #6c63ff;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="dot">📴</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        أنت الآن دون اتصال. سيتم عرض المحتوى المخبّأ عند توفره — أعد المحاولة بعد
        عودة الاتصال، وستُزامَن أي فواتير محفوظة محلياً تلقائياً.
      </p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
    <script>
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
